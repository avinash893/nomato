  <path d="M32 20 C31 24, 28 26, 25 27 C28 24, 30 22, 32 20 Z" fill="#16A34A"/>
  <path d="M32 20 C33 24, 36 26, 39 27 C36 24, 34 22, 32 20 Z" fill="#16A34A"/>
  
